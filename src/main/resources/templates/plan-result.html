<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Workout Plan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="wrap">
    <h1>Your Personal Plan</h1>
    <p class="lead" th:text="${plan.summary}">Workout plan summary</p>

    <!-- Input Summary Chips -->
    <ul class="chips">
        <li>Goal: <strong th:text="${planRequest.goal}">Goal</strong></li>
        <li>Frequency: <strong th:text="${planRequest.daysPerWeek} + ' days/week'">3 days/week</strong></li>
        <li>Session Length: <strong th:text="${planRequest.minutesPerSession} + ' mins'">60 mins</strong></li>
    </ul>

    <!-- Workout Days List -->
    <div class="days">
        <div class="day" th:each="day, iterStat : ${plan.days}" th:style="|--i: ${iterStat.index};|">

            <div class="day-header">
                <div>
                    <h2 th:text="${day.label}">Day Name</h2>
                    <p class="focus" th:text="${day.focus}">Target focus area</p>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Exercise</th>
                        <th>Sets</th>
                        <th>Reps</th>
                        <th>Rest</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="exercise : ${day.exercises}">
                        <td th:text="${exercise.name}">Exercise Name</td>
                        <td th:text="${exercise.sets}">3</td>
                        <td th:text="${exercise.reps}">10-12</td>
                        <td th:text="|${exercise.restSeconds}s|">60s</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Raw Gemini Output (Optional Debug Section) -->
    <div class="note" th:if="${rawPlan != null}">
        <h2>Raw Gemini answer (lesson 5 test)</h2>
        <pre th:text="${rawPlan}" style="white-space: pre-wrap; background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--line);"></pre>
    </div>

    <!-- Action Button -->
    <div class="actions">
        <a th:href="@{/plan}" class="btn secondary">&larr; Create another plan</a>
    </div>

</div>

</body>
</html>
