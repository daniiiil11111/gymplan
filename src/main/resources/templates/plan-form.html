<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your gym plan</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="wrap">
  <h1>Create your plan</h1>
  <p class="lead">Fill in your details to get a personalized workout routine.</p>

  <div class="card">
    <form th:action="@{/plan}" th:object="${planRequest}" method="post">

      <!-- Global Error Alert -->
      <div class="alert" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
      </div>

      <!-- Form Grid -->
      <div class="grid">

        <!-- Age -->
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" th:field="*{age}" placeholder="e.g. 25">
          <span class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">error</span>
        </div>

        <!-- Sex -->
        <div class="field">
          <label for="sex">Sex</label>
          <select id="sex" th:field="*{sex}">
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('sex')}" th:errors="*{sex}">error</span>
        </div>

        <!-- Height -->
        <div class="field">
          <label for="heightCm">Height (cm)</label>
          <input type="number" id="heightCm" th:field="*{heightCm}" placeholder="e.g. 175">
          <span class="error" th:if="${#fields.hasErrors('heightCm')}" th:errors="*{heightCm}">error</span>
        </div>

        <!-- Weight -->
        <div class="field">
          <label for="weightKg">Weight (kg)</label>
          <input type="number" id="weightKg" th:field="*{weightKg}" placeholder="e.g. 70">
          <span class="error" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}">error</span>
        </div>

        <!-- Experience -->
        <div class="field">
          <label for="experience">Experience</label>
          <select id="experience" th:field="*{experience}">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}">error</span>
        </div>

        <!-- Goal -->
        <div class="field">
          <label for="goal">Goal</label>
          <select id="goal" th:field="*{goal}">
            <option value="muscle_gain">Build muscle</option>
            <option value="strength">Get stronger</option>
            <option value="fat_loss">Lose fat</option>
            <option value="general_fitness">General fitness</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('goal')}" th:errors="*{goal}">error</span>
        </div>

        <!-- Equipment -->
        <div class="field">
          <label for="equipment">Equipment</label>
          <select id="equipment" th:field="*{equipment}">
            <option value="full_gym">Full gym</option>
            <option value="dumbbells">Dumbbells only</option>
            <option value="bodyweight">Bodyweight only</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('equipment')}" th:errors="*{equipment}">error</span>
        </div>

        <!-- Days per week -->
        <div class="field">
          <label for="daysPerWeek">Days per week</label>
          <input type="number" id="daysPerWeek" th:field="*{daysPerWeek}" placeholder="e.g. 3">
          <span class="error" th:if="${#fields.hasErrors('daysPerWeek')}" th:errors="*{daysPerWeek}">error</span>
        </div>

        <!-- Minutes per session -->
        <div class="field">
          <label for="minutesPerSession">Minutes per session</label>
          <input type="number" id="minutesPerSession" th:field="*{minutesPerSession}" placeholder="e.g. 60">
          <span class="error" th:if="${#fields.hasErrors('minutesPerSession')}" th:errors="*{minutesPerSession}">error</span>
        </div>

        <!-- Preferred split -->
        <div class="field">
          <label for="splitPreference">Preferred split</label>
          <select id="splitPreference" th:field="*{splitPreference}">
            <option value="ai_decides">Let the AI decide</option>
            <option value="full_body">Full body</option>
            <option value="upper_lower">Upper / lower</option>
            <option value="push_pull_legs">Push / pull / legs</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('splitPreference')}" th:errors="*{splitPreference}">error</span>
        </div>

        <!-- Desired exercises (wide field) -->
        <div class="field wide">
          <label for="desiredExercises">Desired exercises <span class="opt">(optional)</span></label>
          <input type="text" id="desiredExercises" th:field="*{desiredExercises}" placeholder="e.g. pull-ups, deadlifts">
          <span class="error" th:if="${#fields.hasErrors('desiredExercises')}" th:errors="*{desiredExercises}">error</span>
        </div>

        <!-- Focus muscle groups (wide field) -->
        <div class="field wide">
          <label for="focusMuscles">Focus muscle groups <span class="opt">(optional)</span></label>
          <input type="text" id="focusMuscles" th:field="*{focusMuscles}" placeholder="e.g. back, shoulders">
          <span class="error" th:if="${#fields.hasErrors('focusMuscles')}" th:errors="*{focusMuscles}">error</span>
        </div>

        <!-- Language -->
        <div class="field wide">
          <label for="language">Plan language</label>
          <select id="language" th:field="*{language}">
            <option value="en">English</option>
            <option value="de">German</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}">error</span>
        </div>

      </div>

      <button type="submit" class="btn">Create plan</button>
    </form>
  </div>
</div>

</body>
</html>
