<!DOCTYPE html>
<html th:lang="${planRequest.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{result.title}">Your training plan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrap">

    <main id="plan-content">
        <h1 th:text="#{result.title}">Your training plan</h1>
        <p class="lead" th:text="${plan.summary}"></p>

        <ul class="chips">
            <li th:text="#{|goal.${planRequest.goal}|}"></li>
            <li th:text="#{|equipment.${planRequest.equipment}|}"></li>
            <li th:text="#{result.chip.days(${planRequest.daysPerWeek})}"></li>
            <li th:text="#{result.chip.minutes(${planRequest.minutesPerSession})}"></li>
        </ul>

        <div class="days">
            <article class="day" th:each="day, stat : ${plan.days}" th:style="|--i: ${stat.index}|">
                <h2 th:text="${day.label}"></h2>
                <p class="focus" th:text="${day.focus}"></p>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th th:text="#{col.exercise}"></th>
                            <th th:text="#{col.muscle}"></th>
                            <th th:text="#{col.sets}"></th>
                            <th th:text="#{col.reps}"></th>
                            <th th:text="#{col.rir}" th:title="#{col.rir.hint}"></th>
                            <th th:text="#{col.rest}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="exercise : ${day.exercises}">
                            <td th:text="${exercise.name}"></td>
                            <td th:text="#{|muscle.${exercise.muscle}|}"></td>
                            <td th:text="${exercise.sets}"></td>
                            <td th:text="${exercise.reps}"></td>
                            <td th:text="${exercise.rir}"></td>
                            <td th:text="#{unit.seconds(${exercise.restSeconds})}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </article>

            <section class="day" th:if="${volume != null and !volume.isEmpty()}">
                <h2 th:text="#{volume.title}"></h2>
                <ul class="chips">
                    <li th:each="entry : ${volume}"
                        th:classappend="${entry.value lt 10 or entry.value gt 20} ? 'flag'">
                        <span th:text="#{|muscle.${entry.key}|}"></span>
                        <span th:text="${entry.value}"></span>
                    </li>
                </ul>
                <p class="note" th:text="#{volume.hint}"></p>
            </section>

            <section class="day" th:if="${plan.progression != null}">
                <h2 th:text="#{progression.title}"></h2>
                <p th:text="${plan.progression}"></p>
                <h2 th:text="#{deload.title}"></h2>
                <p th:text="${plan.deload}"></p>
            </section>

            <section class="day nutrition" th:if="${nutrition != null}">
                <h2 th:text="#{nutrition.title}"></h2>
                <p class="focus" th:text="#{nutrition.calories(${nutrition.targetCalories})}"></p>
                <p class="focus" th:text="#{nutrition.maintenance(${nutrition.maintenanceCalories})}"></p>
                <ul class="chips">
                    <li><span th:text="#{nutrition.protein}"></span>
                        <span th:text="#{nutrition.grams(${nutrition.proteinGrams})}"></span></li>
                    <li><span th:text="#{nutrition.carbs}"></span>
                        <span th:text="#{nutrition.grams(${nutrition.carbGrams})}"></span></li>
                    <li><span th:text="#{nutrition.fat}"></span>
                        <span th:text="#{nutrition.grams(${nutrition.fatGrams})}"></span></li>
                </ul>
                <p th:if="${nutrition.weeklyChangeKg lt -0.05}"
                   th:text="#{nutrition.rate.loss(${#numbers.formatDecimal(nutrition.weeklyChangeAbsKg, 1, 1)})}"></p>
                <p th:if="${nutrition.weeklyChangeKg gt 0.05}"
                   th:text="#{nutrition.rate.gain(${#numbers.formatDecimal(nutrition.weeklyChangeAbsKg, 1, 1)})}"></p>
                <p class="note" th:if="${!nutrition.note.isEmpty()}" th:text="${nutrition.note}"></p>
                <p class="note" th:text="#{nutrition.disclaimer}"></p>
            </section>
        </div>
    </main>

    <div class="actions no-print">
        <button type="button" class="btn secondary" id="copy-btn"
                th:text="#{button.copy}"
                th:data-copied="#{button.copied}"
                th:data-failed="#{button.copyfailed}">Copy as text</button>
        <button type="button" class="btn secondary" id="print-btn" th:text="#{button.print}">Print / save as PDF</button>
        <a class="btn secondary" th:href="@{/plan}" th:text="#{button.new}">New plan</a>
    </div>

</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
