<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create your gym plan</title>
</head>
<body>
<h1>Create your plan</h1>

<!-- th:action = where the form is sent, th:object = the model object the inputs belong to -->
<form th:action="@{/plan}" th:object="${planRequest}" method="post">

  <p><label>Age
    <input type="number" th:field="*{age}"></label></p>

  <p><label>Sex
    <select th:field="*{sex}">
      <option value="female">Female</option>
      <option value="male">Male</option>
    </select></label></p>

  <p><label>Height (cm)
    <input type="number" th:field="*{heightCm}"></label></p>

  <p><label>Weight (kg)
    <input type="number" th:field="*{weightKg}"></label></p>

  <p><label>Experience
    <select th:field="*{experience}">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select></label></p>

  <p><label>Goal
    <select th:field="*{goal}">
      <option value="muscle_gain">Build muscle</option>
      <option value="strength">Get stronger</option>
      <option value="fat_loss">Lose fat</option>
      <option value="general_fitness">General fitness</option>
    </select></label></p>

  <p><label>Equipment
    <select th:field="*{equipment}">
      <option value="full_gym">Full gym</option>
      <option value="dumbbells">Dumbbells only</option>
      <option value="bodyweight">Bodyweight only</option>
    </select></label></p>

  <p><label>Days per week
    <input type="number" th:field="*{daysPerWeek}"></label></p>

  <p><label>Minutes per session
    <input type="number" th:field="*{minutesPerSession}"></label></p>

  <p><label>Preferred split
    <select th:field="*{splitPreference}">
      <option value="ai_decides">Let the AI decide</option>
      <option value="full_body">Full body</option>
      <option value="upper_lower">Upper / lower</option>
      <option value="push_pull_legs">Push / pull / legs</option>
    </select></label></p>

  <p><label>Desired exercises (optional)
    <input type="text" th:field="*{desiredExercises}" placeholder="e.g. pull-ups, deadlifts"></label></p>

  <p><label>Focus muscle groups (optional)
    <input type="text" th:field="*{focusMuscles}" placeholder="e.g. back, shoulders"></label></p>

  <p><label>Plan language
    <select th:field="*{language}">
      <option value="en">English</option>
      <option value="de">German</option>
    </select></label></p>

  <button type="submit">Create plan</button>
</form>
</body>
</html>
